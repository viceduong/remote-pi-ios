name: Build iOS App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-remote-pi:
    name: Build RemotePi (iOS 15)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode Project
        run: |
          cd ios
          xcodegen generate --spec project.yml
      - name: Build RemotePi
        run: |
          cd ios
          xcodebuild -project AiChing.xcodeproj -scheme RemotePi \
            -destination 'generic/platform=iOS' -configuration Debug clean build \
            CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
      - name: Package .ipa
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name 'RemotePi.app' -type d -path '*/Debug-iphoneos/*' | head -1)
          mkdir -p Payload && cp -R "$APP_PATH" Payload/
          zip -r RemotePi.ipa Payload/
      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: RemotePi-ipa
          path: RemotePi.ipa
          retention-days: 14

  test-remote-pi:
    name: Test RemotePi (unit)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode Project
        run: |
          cd ios
          xcodegen generate --spec project.yml
      - name: Run unit tests
        run: |
          cd ios
          SIM_ID=$(xcrun simctl list devices available | grep -E 'iPhone' | head -1 | grep -oE '\([0-9A-F-]{36}\)' | tr -d '()')
          echo "sim: $SIM_ID"
          xcodebuild test -project AiChing.xcodeproj -scheme RemotePi \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            CODE_SIGNING_ALLOWED=NO
      - name: Upload UI snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RemotePi-snapshots
          path: ~/remotepi-snapshots
          if-no-files-found: warn
          retention-days: 14

  expand-ios15:
    name: Expand repro (iOS 15 simulator)
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Install iOS 15 simulator runtime
        run: |
          xcodebuild -version
          xcrun simctl list runtimes
          if ! xcrun simctl list runtimes | grep -q 'iOS 15'; then
            sudo xcodes runtimes install "iOS 15.5" || true
          fi
          xcrun simctl list runtimes
      - name: Run expand tests on iOS 15
        run: |
          cd ios
          xcodegen generate --spec project.yml
          # Xcode 15.4 cannot open the Xcode 16 project format (objectVersion 77).
          sed -i '' -E 's/objectVersion = [0-9]+;/objectVersion = 56;/' AiChing.xcodeproj/project.pbxproj
          RT=$(xcrun simctl list runtimes | grep -oE 'com\.apple\.CoreSimulator\.SimRuntime\.iOS-15-[0-9]+' | tail -1)
          echo "runtime: $RT"
          test -n "$RT"
          UDID=$(xcrun simctl create ios15 "iPhone 13" "$RT")
          xcodebuild test -project AiChing.xcodeproj -scheme RemotePi \
            -destination "platform=iOS Simulator,id=$UDID" \
            -only-testing:RemotePiTests/ExpandCrashReproTests \
            CODE_SIGNING_ALLOWED=NO
